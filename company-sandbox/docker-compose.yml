services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: careops_legacy_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./laravel-app:/var/www/html
      - ../local/seed-data:/var/www/seed-data
      - ./.env:/var/www/html/.env
    networks:
      - careops_sandbox_net
    depends_on:
      db:
        condition: service_healthy

  web:
    image: nginx:1.27-alpine
    container_name: careops_legacy_web
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./laravel-app:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - careops_sandbox_net
    depends_on:
      - app

  db:
    image: mysql:8.0
    container_name: careops_legacy_db
    restart: unless-stopped
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${DB_DATABASE:?Set DB_DATABASE in .env}
      MYSQL_USER: ${DB_USERNAME:?Set DB_USERNAME in .env}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - careops_db_data:/var/lib/mysql
    networks:
      - careops_sandbox_net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  careops_db_data:
    name: careops_legacy_db_data

networks:
  careops_sandbox_net:
    name: careops_sandbox_network

