name: Platform CI

on:
  push:
    branches: [main, "phase/*", "feature/*"]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-types:
    name: Python Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          version: "latest"

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen

      - name: Check code formatting (black)
        run: uv run black --check services agents scripts

      - name: Lint source code (ruff)
        run: uv run ruff check services agents scripts

      - name: Strict type check (mypy)
        run: uv run mypy --strict services/agent-api/src services/agent-api/tests services/mcp-servers/src services/mcp-servers/tests scripts

  frontend-build:
    name: Frontend Typecheck & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Build frontend SPA (TypeScript & Vite)
        run: |
          cd frontend
          npm run build

  policy-and-unit-tests:
    name: OPA Policies & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          version: "latest"

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run OPA policy tests
        run: |
          curl -L -o opa https://openpolicyagent.org/downloads/v0.68.0/opa_linux_amd64_static
          chmod 755 ./opa
          ./opa test infra/opa/policies/ -v

      - name: Start platform containers (PostgreSQL, Redis, Keycloak, OPA)
        run: |
          docker compose up -d
          echo "Waiting for PostgreSQL to be ready..."
          until docker exec careops_platform_postgres pg_isready -U careops_user -d careops; do
            sleep 1
          done
          echo "PostgreSQL is ready."

      - name: Run Python test suite (pytest)
        run: uv run pytest
