services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: careops_platform_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: careops_platform
      POSTGRES_USER: ${POSTGRES_USER:-careops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-careops_dev_secret}
    ports:
      - "5432:5432"
    volumes:
      - careops_platform_pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - careops_platform_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-careops} -d careops_platform"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7.4-alpine
    container_name: careops_platform_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - careops_platform_redisdata:/data
    networks:
      - careops_platform_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  opa:
    image: openpolicyagent/opa:0.68.0-static
    container_name: careops_platform_opa
    restart: unless-stopped
    ports:
      - "8181:8181"
    command:
      - "run"
      - "--server"
      - "--log-level=info"
      - "--set=decision_logs.console=true"
      - "/policies"
    volumes:
      - ./infra/opa/policies:/policies:ro
    networks:
      - careops_platform_network
    healthcheck:
      test: ["CMD", "/opa", "check", "/policies"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  keycloak:
    image: quay.io/keycloak/keycloak:24.0.5
    container_name: careops_platform_keycloak
    restart: unless-stopped
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin_dev_secret}
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      KC_HTTP_PORT: 8081
    ports:
      - "8081:8081"
    volumes:
      - ./infra/keycloak:/opt/keycloak/data/import:ro
    networks:
      - careops_platform_network
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8081 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost:8081\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '200 OK'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  careops_platform_pgdata:
    name: careops_platform_pgdata
  careops_platform_redisdata:
    name: careops_platform_redisdata

networks:
  careops_platform_network:
    name: careops_platform_network
    driver: bridge
  careops_sandbox_network:
    external: true
